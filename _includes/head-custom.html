<!-- Renderiza los bloques ```mermaid en GitHub Pages (en github.com ya se ven solos). -->
<style>
  .mermaid-diagrama { text-align: center; margin: 1.5em 0; overflow-x: auto; }
</style>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

  document.addEventListener("DOMContentLoaded", async () => {
    // Jekyll (kramdown + rouge) genera <div class="language-mermaid ..."><pre><code>...</code></pre></div>
    const bloques = document.querySelectorAll(
      "div.language-mermaid, pre > code.language-mermaid"
    );
    if (!bloques.length) return;

    const nodos = [];
    bloques.forEach((bloque) => {
      const contenedor = bloque.matches("code") ? bloque.parentElement : bloque;
      const div = document.createElement("div");
      div.className = "mermaid mermaid-diagrama";
      div.textContent = bloque.textContent;
      contenedor.replaceWith(div);
      nodos.push(div);
    });

    mermaid.initialize({ startOnLoad: false, securityLevel: "strict" });
    await mermaid.run({ nodes: nodos });
  });
</script>
